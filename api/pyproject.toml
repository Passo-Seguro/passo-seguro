[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "banco: usa o Postgres de teste (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# A pasta api/alembic/ (migrações) tem o mesmo nome da biblioteca alembic.
known-third-party = ["alembic"]
known-first-party = ["app"]
