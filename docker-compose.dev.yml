# Ambiente de DESENVOLVIMENTO: API + Postgres com PostGIS.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Visão e assistente falsos (opt-in, só para desenvolvimento):
#   docker compose -f docker-compose.dev.yml -f docker-compose.fakes.yml up --build
#
# A API sobe em http://localhost:8000 (documentação interativa em /docs), roda as migrações
# do Alembic ao iniciar e guarda as fotos no volume "fotos".
# Todos os valores abaixo são FICTÍCIOS e só valem para desenvolvimento local. Para mudar,
# exporte a variável (ex.: SERVICE_TOKEN=...) ou crie um arquivo .env ao lado deste.
name: passo-seguro-dev

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: passo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passo-dev}
      POSTGRES_DB: passo_seguro
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passo -d passo_seguro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://passo:${DB_PASSWORD:-passo-dev}@db:5432/passo_seguro
      SERVICE_TOKEN: ${SERVICE_TOKEN:-token-servico-dev}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-token-robo-dev}
      METRICS_TOKEN: ${METRICS_TOKEN:-token-metricas-dev}
      SALT_AUTOR: ${SALT_AUTOR:-sal-de-desenvolvimento}
      # Emenda rc2 do contrato (autor_id, robô com token, /relatos/proximos, /meus-relatos, PATCH).
      # Ligada aqui para o app poder desenvolver; no código o padrão é desligada até o grupo aprovar.
      HABILITAR_RC2: ${HABILITAR_RC2:-true}
      # Visão e assistente: por padrão NÃO são falsos. Sem VISAO_URL a visão fica "fora do ar" (o relato
      # é criado sem categoria) e, sem ASSISTENTE_URL, o assistente responde a recusa padrão com o
      # SP156. Para os falsos (só desenvolvimento): docker-compose.fakes.yml.
      USE_FAKE_VISAO: ${USE_FAKE_VISAO:-false}
      VISAO_URL: ${VISAO_URL:-}
      VISAO_TOKEN: ${VISAO_TOKEN:-}
      USE_FAKE_ASSISTENTE: ${USE_FAKE_ASSISTENTE:-false}
      ASSISTENTE_URL: ${ASSISTENTE_URL:-}
      ASSISTENTE_TOKEN: ${ASSISTENTE_TOKEN:-}
      # Painel: arquivo exportado pelo pipeline de dados. Aqui, um exemplo fictício do repositório.
      PAINEL_JSON_PATH: /data/painel/vw_prioridades.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - fotos:/data/fotos
      - ./docs/exemplos/vw_prioridades.json:/data/painel/vw_prioridades.json:ro
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log

volumes:
  pgdata:
  fotos:
