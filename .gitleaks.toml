# Configuração do gitleaks (varredura de segredos). Usa as regras padrão e libera só
# valores claramente FICTÍCIOS que aparecem em exemplos de documentação e no ambiente de
# desenvolvimento. Nenhum segredo real é versionado.
title = "Passo Seguro"

[extend]
useDefault = true

[[allowlists]]
description = "Tokens de exemplo fictícios (README, mock, docker-compose.dev.yml e docker-compose.yml)"
regexes = [
  '''token-ficticio''',
  '''token-[a-z]+-dev''',
  '''sal-de-desenvolvimento''',
  '''token-[a-z]+-local''',
  '''sal-local-ficticio''',
]
