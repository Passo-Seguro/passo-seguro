  /relatos/proximos:
    get:
      tags: [Relatos]
      operationId: listarRelatosProximos
      summary: Lista relatos próximos de um ponto (para o mapa público)
      description: |
        Chamado pelo **app** para desenhar o mapa. Devolve os relatos num raio ao redor de
        `lat`/`lon`, **sem foto e sem descrição**, e só os de status diferente de
        `rejeitado`.

        **Privacidade (LGPD):** `lat` e `lon` da resposta são **arredondados a 3 casas
        decimais** (cerca de 100 m). A localização exata nunca sai por este endpoint. A
        busca em si usa a localização exata guardada.

        A ordem dos itens é do mais próximo para o mais distante.

        Endpoint **público** (decisão provisória, ver a introdução do contrato).
      security: []
      parameters:
        - name: lat
          in: query
          description: Latitude do centro da busca, em graus decimais.
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: -23.5505
        - name: lon
          in: query
          description: Longitude do centro da busca, em graus decimais.
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: -46.6333
        - name: raio_m
          in: query
          description: Raio da busca, em metros.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
            example: 1000
      responses:
        '200':
          description: Relatos dentro do raio (pode ser uma lista vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatoProximo'
              examples:
                proximos:
                  summary: Relatos perto da Sé, com localização arredondada
                  value:
                    - id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                      lat: -23.551
                      lon: -46.633
                      categoria: buraco
                      status: novo
                      prioridade: null
                      confirmacoes: 0
                    - id: 7a2e5b90-4f13-4c68-b0d7-3c8a1e6f9d55
                      lat: -23.55
                      lon: -46.634
                      categoria: piso_danificado
                      status: encaminhado
                      prioridade: alta
                      confirmacoes: 4
                    - id: e3a85c17-2d4b-4f90-8c61-9b0d6e7f1a44
                      lat: -23.552
                      lon: -46.631
                      categoria: null
                      status: novo
                      prioridade: null
                      confirmacoes: 0
                vazio:
                  summary: Nenhum relato no raio
                  value: []
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /relatos/{id}:
    patch:
      tags: [Relatos]
      operationId: atualizarRelato
      summary: Corrige um relato (app) ou atualiza o andamento (triagem)
      description: |
        Dois modos, conforme a autenticação:

        **(a) App.** Cabeçalho `X-Autor-Id` igual ao id do autor do relato. Pode alterar
        **somente `categoria`**, e **só enquanto o `status` for `novo`**. É o "confirmar ou
        corrigir" da tela de reportar. Qualquer outro campo, outro autor, relato sem autor
        ou `status` diferente de `novo` resulta em 403.

        **(b) Triagem.** `bearerAuth`. Pode alterar `categoria`, `status`, `subprefeitura`,
        `prioridade` e `confirmacoes`, em qualquer `status`.

        Só os campos enviados são alterados (atualização parcial); o corpo precisa ter pelo
        menos um campo. Se `Authorization` vier, ele manda: token inválido é 401, sem cair
        no modo (a). Sem nenhuma credencial, 401.

        A resposta é o relato completo depois da alteração.
      security:
        - bearerAuth: []
        - autorId: []
      parameters:
        - name: id
          in: path
          description: Identificador do relato.
          required: true
          schema:
            type: string
            format: uuid
            example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizacaoRelato'
            examples:
              app_corrige_categoria:
                summary: App - o cidadão corrige a categoria detectada
                value:
                  categoria: piso_danificado
              triagem_encaminha:
                summary: Triagem - encaminha o relato com subprefeitura e prioridade
                value:
                  status: encaminhado
                  subprefeitura: Sé
                  prioridade: alta
                  confirmacoes: 3
      responses:
        '200':
          description: Relato atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relato'
              examples:
                app_corrigido:
                  summary: Depois da correção feita pelo app
                  value:
                    id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                    criado_em: '2026-11-04T14:32:10-03:00'
                    lat: -23.5505
                    lon: -46.6333
                    foto_url: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
                    descricao: Buraco grande na calçada em frente ao número 120.
                    categoria: piso_danificado
                    confianca: 0.94
                    fonte: app
                    status: novo
                    confirmacoes: 0
                    subprefeitura: null
                    prioridade: null
                triagem_encaminhado:
                  summary: Depois do encaminhamento feito pela triagem
                  value:
                    id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                    criado_em: '2026-11-04T14:32:10-03:00'
                    lat: -23.5505
                    lon: -46.6333
                    foto_url: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
                    descricao: Buraco grande na calçada em frente ao número 120.
                    categoria: buraco
                    confianca: 0.94
                    fonte: app
                    status: encaminhado
                    confirmacoes: 3
                    subprefeitura: Sé
                    prioridade: alta
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /meus-relatos:
    get:
      tags: [Relatos]
      operationId: listarMeusRelatos
      summary: Lista os relatos do próprio cidadão
      description: |
        Chamado pelo **app** (tela "meus relatos"). Usa o cabeçalho `X-Autor-Id`, o id
        anônimo gerado no aparelho, e devolve os relatos criados com aquele `autor_id`,
        do mais recente para o mais antigo, até **100** itens.

        Sem o cabeçalho, ou com valor que não é um UUID, a resposta é 400. Um autor sem
        relatos recebe uma lista vazia.

        Endpoint **público** (decisão provisória, ver a introdução do contrato): quem
        souber o `autor_id` vê os relatos dele. Como o id é um UUID aleatório que fica só no
        aparelho, isso basta para o MVP.
      security: []
      parameters:
        - name: X-Autor-Id
          in: header
          description: Id anônimo do autor, gerado no aparelho (UUID).
          required: true
          schema:
            type: string
            format: uuid
            example: 3f2b8c1e-7d4a-4e90-9b15-6a0c2d8e4f71
      responses:
        '200':
          description: Relatos do autor (pode ser uma lista vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatoResumo'
              examples:
                dois_relatos:
                  summary: Um relato com categoria e um sem detecção
                  value:
                    - id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                      criado_em: '2026-11-04T14:32:10-03:00'
                      categoria: buraco
                      status: novo
                      foto_url: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
                    - id: e3a85c17-2d4b-4f90-8c61-9b0d6e7f1a44
                      criado_em: '2026-11-02T09:12:30-03:00'
                      categoria: null
                      status: encaminhado
                      foto_url: https://fotos.exemplo.invalid/relatos/e3a85c17.jpg
                vazio:
                  summary: O autor ainda não fez relatos
                  value: []
        '400':
          description: Cabeçalho `X-Autor-Id` ausente ou que não é um UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                sem_cabecalho:
                  value:
                    codigo: requisicao_invalida
                    mensagem: O cabeçalho X-Autor-Id é obrigatório.
                    detalhes:
                      - campo: X-Autor-Id
                        problema: é obrigatório e deve ser um UUID

  /deteccoes:
    post:
      tags: [Deteccoes]
      operationId: detectarProblemas
      summary: Detecta problemas de calçada em uma imagem
      description: |
        Chamado pela **API** (ao criar um relato) e pela **triagem**. Recebe a imagem e
        devolve a lista de problemas detectados, ordenada da maior para a menor
        `confianca`. Uma lista vazia significa que nada foi detectado.

        **Formato da `caixa`** (decisão do projeto): `{x, y, largura, altura}`, todos
        **normalizados de 0 a 1** em relação ao tamanho da imagem. `x` e `y` são o canto
        superior esquerdo da caixa. Quem treina o YOLO deve converter, porque o formato de
        rótulo do YOLO usa o centro da caixa.

        A imagem pode ter no máximo **10 MB** (decisão provisória); acima disso, 413.

        Endpoint **protegido** por `bearerAuth` (chamada entre serviços).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NovaDeteccao'
            encoding:
              imagem:
                contentType: image/jpeg, image/png
            examples:
              imagem:
                summary: Imagem de uma calçada
                value:
                  imagem: calcada-pinheiros.jpg
      responses:
        '200':
          description: Lista de detecções (pode ser vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deteccao'
              examples:
                buraco:
                  summary: Um buraco
                  value:
                    - classe: buraco
                      confianca: 0.94
                      caixa: {x: 0.31, y: 0.58, largura: 0.22, altura: 0.17}
                piso_danificado:
                  summary: Piso danificado
                  value:
                    - classe: piso_danificado
                      confianca: 0.88
                      caixa: {x: 0.12, y: 0.64, largura: 0.48, altura: 0.25}
                obstaculo:
                  summary: Obstáculo
                  value:
                    - classe: obstaculo
                      confianca: 0.81
                      caixa: {x: 0.40, y: 0.30, largura: 0.35, altura: 0.52}
                veiculo_na_calcada:
                  summary: Veículo na calçada
                  value:
                    - classe: veiculo_na_calcada
                      confianca: 0.97
                      caixa: {x: 0.05, y: 0.22, largura: 0.71, altura: 0.60}
                varias:
                  summary: Mais de um problema na mesma imagem
                  value:
                    - classe: veiculo_na_calcada
                      confianca: 0.97
                      caixa: {x: 0.05, y: 0.22, largura: 0.71, altura: 0.60}
                    - classe: piso_danificado
                      confianca: 0.63
                      caixa: {x: 0.60, y: 0.78, largura: 0.30, altura: 0.18}
                nada_detectado:
                  summary: Nada detectado
                  value: []
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '413':
          $ref: '#/components/responses/ArquivoGrande'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /assistente:
    post:
      tags: [Assistente]
      operationId: perguntarAoAssistente
      summary: Pergunta ao assistente do pedestre
      description: |
        Chamado pelo **app**. O assistente (LLM local com RAG) responde sobre quem é
        responsável por consertar um problema de calçada e como reclamar, sempre citando
        as `fontes`. Perguntas fora desse escopo, ou sem base nas fontes, são recusadas
        com `recusou: true`.

        Endpoint **público** (decisão provisória, ver a introdução do contrato). Os
        textos dos exemplos são ilustrativos, não orientação oficial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntaAssistente'
            examples:
              com_fontes:
                summary: Pergunta dentro do escopo
                value:
                  pergunta: Quem conserta uma calçada quebrada em frente ao meu prédio?
              recusa:
                summary: Pergunta fora do escopo
                value:
                  pergunta: Qual a melhor ação para investir esse mês?
      responses:
        '200':
          description: Resposta do assistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAssistente'
              examples:
                com_fontes:
                  summary: Respondeu, com fontes (recusou false)
                  value:
                    resposta: Em geral, o cuidado com o piso da calçada é de quem é dono do imóvel em frente. Se o problema for na área pública ou causado por obra de concessionária, a subprefeitura da região pode ser acionada pelo canal 156. Registre o problema aqui para acompanhar o caso.
                    fontes:
                      - titulo: Cartilha de calçadas da subprefeitura (exemplo)
                        url: https://documentos.exemplo.invalid/cartilha-calcadas.pdf
                    confianca: 0.86
                    recusou: false
                recusa:
                  summary: Recusou responder (recusou true)
                  value:
                    resposta: Eu só consigo ajudar com problemas em calçadas de São Paulo, como quem conserta e como reclamar. Não tenho como responder sobre investimentos.
                    fontes: []
                    confianca: 0.1
                    recusou: true
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /painel:
    get:
      tags: [Painel]
      operationId: obterPainel
      summary: Prioridades por subprefeitura
      description: |
        Chamado pelo **app**. Devolve as prioridades por subprefeitura, lidas da view
        `vw_prioridades` da camada Ouro, exportada pelo pipeline de dados para a API. Os
        itens vêm ordenados da maior para a menor prioridade.

        Endpoint **público** (decisão provisória, ver a introdução do contrato).
      security: []
      responses:
        '200':
          description: Prioridades por subprefeitura.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioridadeSubprefeitura'
              examples:
                se_e_pinheiros:
                  summary: Sé e Pinheiros
                  value:
                    - subprefeitura: Sé
                      prioridade: alta
                      relatos_abertos: 69
                      relatos_por_categoria:
                        buraco: 12
                        piso_danificado: 31
                        obstaculo: 9
                        veiculo_na_calcada: 17
                      tempo_medio_ate_reparo_dias: 41.5
                      atualizado_em: '2026-11-04T06:00:00-03:00'
                    - subprefeitura: Pinheiros
                      prioridade: media
                      relatos_abertos: 38
                      relatos_por_categoria:
                        buraco: 5
                        piso_danificado: 14
                        obstaculo: 11
                        veiculo_na_calcada: 8
                      tempo_medio_ate_reparo_dias: null
                      atualizado_em: '2026-11-04T06:00:00-03:00'
        '404':
          description: Ainda não há painel disponível, porque o pipeline não exportou a view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                sem_painel:
                  value:
                    codigo: painel_indisponivel
                    mensagem: O painel de prioridades ainda não foi exportado pelo pipeline de dados.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token enviado em `Authorization: Bearer <token>`. Usado apenas nas chamadas entre
        serviços (`GET /relatos`, `POST /deteccoes`) e na triagem do `PATCH /relatos/{id}`.
        Decisão provisória; nenhum token real é versionado no repositório.
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: |
        Token do dispositivo do robô inspetor. Obrigatório em `POST /relatos` quando
        `fonte=robo`. Decisão provisória; nenhum token real é versionado no repositório.
    autorId:
      type: apiKey
      in: header
      name: X-Autor-Id
      description: |
        Id anônimo (UUID) gerado no aparelho do cidadão. Não é um segredo forte: só liga o
        aparelho aos relatos que ele criou. Usado no modo app de `PATCH /relatos/{id}`.

  responses:
    RequisicaoInvalida:
      description: Requisição malformada, por exemplo parâmetro de consulta inválido ou corpo que não é do tipo esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            parametro_invalido:
              value:
                codigo: requisicao_invalida
                mensagem: A requisição está malformada.
                detalhes:
                  - campo: tamanho
                    problema: deve ser um inteiro entre 1 e 100
    DadosInvalidos:
      description: A requisição está bem formada, mas os dados não passam na validação. Por exemplo, coordenadas fora do município de São Paulo, imagem ilegível ou pergunta vazia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            dados_invalidos:
              value:
                codigo: dados_invalidos
                mensagem: Os dados enviados não são válidos.
                detalhes:
                  - campo: lat
                    problema: deve estar entre -90 e 90
    ArquivoGrande:
      description: O arquivo enviado passa do tamanho máximo de 10 MB (decisão provisória).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            arquivo_grande:
              value:
                codigo: arquivo_grande
                mensagem: O arquivo enviado passa do tamanho máximo de 10 MB.
    Proibido:
      description: A credencial é válida, mas não autoriza esta alteração. No modo app, por exemplo, outro autor, campo que não seja `categoria` ou relato que já saiu de `novo`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            outro_autor:
              summary: O X-Autor-Id não é o do autor do relato
              value:
                codigo: proibido
                mensagem: Este relato pertence a outro autor.
            fora_de_novo:
              summary: O relato já saiu do status novo
              value:
                codigo: proibido
                mensagem: A categoria só pode ser corrigida enquanto o relato está novo.
            campo_nao_permitido:
              summary: No modo app, só a categoria pode mudar
              value:
                codigo: proibido
                mensagem: O app só pode alterar a categoria.
    NaoEncontrado:
      description: Não existe relato com esse id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            relato_inexistente:
              value:
                codigo: nao_encontrado
                mensagem: Relato não encontrado.
    DispositivoNaoAutenticado:
      description: Relato com `fonte=robo` sem o cabeçalho `X-Device-Token`, ou com valor inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            sem_token_do_robo:
              value:
                codigo: nao_autenticado
                mensagem: Token do dispositivo ausente ou inválido.
    NaoAutenticado:
      description: Credencial ausente ou inválida. O endpoint exige `bearerAuth` (chamada entre serviços) ou, no modo app do `PATCH /relatos/{id}`, o cabeçalho `X-Autor-Id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            sem_token:
              value:
                codigo: nao_autenticado
                mensagem: Token ausente ou inválido.

  schemas:
    Categoria:
      type: string
      description: |
        Classe do problema de calçada. Os valores e a ordem vêm de `contratos/classes.yaml`
        (fonte única de verdade). A posição na lista é o índice da classe no YOLO.
      enum:
        - buraco
        - piso_danificado
        - obstaculo
        - veiculo_na_calcada
      example: buraco

    StatusRelato:
      type: string
      description: |
        Etapa do relato. Fluxo normal: `novo` → `revisao_humana` → `validado` →
        `encaminhado` → `resolvido`. Um relato também pode terminar em `rejeitado`.

        A API sempre cria o relato como `novo`. As mudanças seguintes são feitas pela
        triagem, por exemplo "confiança menor que 0,5 → `revisao_humana`".
      enum:
        - novo
        - revisao_humana
        - validado
        - encaminhado
        - resolvido
        - rejeitado
      example: novo

    Prioridade:
      type: string
      description: Prioridade de atendimento.
      enum:
        - alta
        - media
        - baixa
      example: alta

    FonteRelato:
      type: string
      description: Quem originou o relato.
      enum:
        - app
        - robo
      example: app

    Confianca:
      type: number
      minimum: 0
      maximum: 1
      description: Confiança, de 0 a 1.
      example: 0.94

    CategoriaOuNula:
      description: |
        Mesma `Categoria`, ou `null` quando o serviço de visão não detectou nada. Só vale
        para `Relato` e `RelatoCriado`; em `Deteccao` a classe nunca é nula.
      oneOf:
        - $ref: '#/components/schemas/Categoria'
        - type: 'null'
      example: buraco

    ConfiancaOuNula:
      description: |
        Confiança de 0 a 1, ou `null` quando o serviço de visão não detectou nada. Só vale
        para `Relato` e `RelatoCriado`; em `Deteccao` a confiança nunca é nula.
      oneOf:
        - $ref: '#/components/schemas/Confianca'
        - type: 'null'
      example: 0.94

    Relato:
      type: object
      description: Um relato de problema em calçada.
      required:
        - id
        - criado_em
        - lat
        - lon
        - foto_url
        - categoria
        - confianca
        - fonte
        - status
        - confirmacoes
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        criado_em:
          type: string
          format: date-time
          description: Quando o relato foi criado.
          example: '2026-11-04T14:32:10-03:00'
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude em graus decimais.
          example: -23.5505
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude em graus decimais.
          example: -46.6333
        foto_url:
          type: string
          format: uri
          description: Endereço da foto do relato.
          example: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
        descricao:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: |
            Texto livre do cidadão; pode ser nulo. **Pode conter telefone ou CPF**, que a
            triagem mascara depois.
          example: Buraco grande na calçada em frente ao número 120.
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        confianca:
          $ref: '#/components/schemas/ConfiancaOuNula'
        fonte:
          $ref: '#/components/schemas/FonteRelato'
        status:
          $ref: '#/components/schemas/StatusRelato'
        confirmacoes:
          type: integer
          minimum: 0
          description: Quantas pessoas confirmaram o mesmo problema. Começa em 0.
          example: 3
        subprefeitura:
          type:
            - string
            - 'null'
          description: |
            Subprefeitura responsável pelo local. Nula enquanto o relato está `novo`; fica
            preenchida a partir de `encaminhado`.
          example: Sé
        prioridade:
          description: |
            Prioridade de atendimento. Nula enquanto o relato está `novo`; fica preenchida
            a partir de `encaminhado`.
          oneOf:
            - $ref: '#/components/schemas/Prioridade'
            - type: 'null'
          example: alta

    NovoRelato:
      type: object
      description: Corpo `multipart/form-data` de `POST /relatos`.
      required:
        - foto
        - lat
        - lon
        - fonte
      properties:
        foto:
          type: string
          format: binary
          description: Arquivo da foto (JPEG ou PNG), de no máximo 10 MB (decisão provisória).
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude em graus decimais.
          example: -23.5505
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude em graus decimais.
          example: -46.6333
        descricao:
          type: string
          maxLength: 1000
          description: Texto livre opcional. Pode conter telefone ou CPF digitado pelo cidadão.
          example: Buraco grande na calçada em frente ao número 120.
        fonte:
          $ref: '#/components/schemas/FonteRelato'
        autor_id:
          type: string
          format: uuid
          description: |
            Id anônimo gerado no aparelho (opcional). A API guarda só o hash (SHA-256 com
            sal) e **nunca o devolve**.
          example: 3f2b8c1e-7d4a-4e90-9b15-6a0c2d8e4f71

    RelatoCriado:
      type: object
      description: Resposta de `POST /relatos`.
      required:
        - id
        - categoria
        - confianca
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato criado.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        confianca:
          $ref: '#/components/schemas/ConfiancaOuNula'
        status:
          type: string
          const: novo
          description: A API sempre cria o relato como `novo`.
          example: novo

    RelatoProximo:
      type: object
      description: |
        Relato no mapa público. **Sem foto, sem descrição e sem autor.** `lat` e `lon` vêm
        arredondados a 3 casas decimais (cerca de 100 m).
      required:
        - id
        - lat
        - lon
        - categoria
        - status
        - prioridade
        - confirmacoes
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude arredondada a 3 casas decimais.
          example: -23.551
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude arredondada a 3 casas decimais.
          example: -46.633
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        status:
          $ref: '#/components/schemas/StatusRelato'
        prioridade:
          description: Prioridade de atendimento; nula enquanto o relato está `novo`.
          oneOf:
            - $ref: '#/components/schemas/Prioridade'
            - type: 'null'
          example: alta
        confirmacoes:
          type: integer
          minimum: 0
          description: Quantas pessoas confirmaram o mesmo problema.
          example: 0

    RelatoResumo:
      type: object
      description: Relato do próprio cidadão, na tela "meus relatos".
      required:
        - id
        - criado_em
        - categoria
        - status
        - foto_url
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        criado_em:
          type: string
          format: date-time
          description: Quando o relato foi criado.
          example: '2026-11-04T14:32:10-03:00'
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        status:
          $ref: '#/components/schemas/StatusRelato'
        foto_url:
          type: string
          format: uri
          description: Endereço da foto do relato.
          example: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg

    AtualizacaoRelato:
      type: object
      description: |
        Corpo de `PATCH /relatos/{id}`. Atualização parcial: só os campos enviados mudam, e
        é preciso enviar pelo menos um. No modo **app** só `categoria` é aceita; os demais
        campos são do modo **triagem** (`bearerAuth`).
      minProperties: 1
      additionalProperties: false
      properties:
        categoria:
          $ref: '#/components/schemas/Categoria'
        status:
          $ref: '#/components/schemas/StatusRelato'
        subprefeitura:
          type: string
          minLength: 1
          maxLength: 100
          description: Subprefeitura responsável pelo local.
          example: Sé
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        confirmacoes:
          type: integer
          minimum: 0
          description: Quantas pessoas confirmaram o mesmo problema (valor absoluto).
          example: 3

    NovaDeteccao:
      type: object
      description: Corpo `multipart/form-data` de `POST /deteccoes`.
      required:
        - imagem
      properties:
        imagem:
          type: string
          format: binary
          description: Arquivo da imagem (JPEG ou PNG), de no máximo 10 MB (decisão provisória).

    Caixa:
      type: object
      description: |
        Caixa delimitadora **normalizada de 0 a 1** em relação à largura e à altura da
        imagem. `x` e `y` são o canto superior esquerdo.
      required:
        - x
        - y
        - largura
        - altura
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
          description: Posição horizontal do canto superior esquerdo.
          example: 0.31
        y:
          type: number
          minimum: 0
          maximum: 1
          description: Posição vertical do canto superior esquerdo.
          example: 0.58
        largura:
          type: number
          minimum: 0
          maximum: 1
          description: Largura da caixa.
          example: 0.22
        altura:
          type: number
          minimum: 0
          maximum: 1
          description: Altura da caixa.
          example: 0.17

    Deteccao:
      type: object
      description: Um problema detectado em uma imagem.
      required:
        - classe
        - confianca
        - caixa
      properties:
        classe:
          $ref: '#/components/schemas/Categoria'
        confianca:
          $ref: '#/components/schemas/Confianca'
        caixa:
          $ref: '#/components/schemas/Caixa'
      example:
        classe: buraco
        confianca: 0.94
        caixa: {x: 0.31, y: 0.58, largura: 0.22, altura: 0.17}

    PerguntaAssistente:
      type: object
      description: Corpo de `POST /assistente`.
      required:
        - pergunta
      properties:
        pergunta:
          type: string
          minLength: 1
          maxLength: 500
          description: Pergunta do pedestre, em texto livre.
          example: Quem conserta uma calçada quebrada em frente ao meu prédio?

    FonteCitada:
      type: object
      description: Documento em que o assistente se baseou.
      required:
        - titulo
      properties:
        titulo:
          type: string
          description: Título do documento.
          example: Cartilha de calçadas da subprefeitura (exemplo)
        url:
          type: string
          format: uri
          description: Endereço do documento, quando houver.
          example: https://documentos.exemplo.invalid/cartilha-calcadas.pdf

    RespostaAssistente:
      type: object
      description: Resposta de `POST /assistente`.
      required:
        - resposta
        - fontes
        - confianca
        - recusou
      properties:
        resposta:
          type: string
          description: Texto da resposta, ou a explicação da recusa.
          example: Em geral, o cuidado com o piso da calçada é de quem é dono do imóvel em frente. Registre o problema aqui para acompanhar o caso.
        fontes:
          type: array
          description: Documentos citados. Fica vazio quando `recusou` é `true`.
          items:
            $ref: '#/components/schemas/FonteCitada'
        confianca:
          $ref: '#/components/schemas/Confianca'
        recusou:
          type: boolean
          description: '`true` quando o assistente se recusou a responder, por estar fora do escopo ou sem base nas fontes.'
          example: false

    PrioridadeSubprefeitura:
      type: object
      description: Linha da view `vw_prioridades` (camada Ouro), por subprefeitura.
      required:
        - subprefeitura
        - prioridade
        - relatos_abertos
        - relatos_por_categoria
        - atualizado_em
      properties:
        subprefeitura:
          type: string
          example: Sé
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        relatos_abertos:
          type: integer
          minimum: 0
          description: Relatos ainda não resolvidos nem rejeitados.
          example: 69
        relatos_por_categoria:
          type: object
          description: Relatos abertos por classe de problema.
          propertyNames:
            $ref: '#/components/schemas/Categoria'
          additionalProperties:
            type: integer
            minimum: 0
          example:
            buraco: 12
            piso_danificado: 31
            obstaculo: 9
            veiculo_na_calcada: 17
        tempo_medio_ate_reparo_dias:
          type:
            - number
            - 'null'
          minimum: 0
          description: Tempo médio até o reparo, em dias; nulo quando ainda não há reparos.
          example: 41.5
        atualizado_em:
          type: string
          format: date-time
          description: Quando o pipeline exportou os dados.
          example: '2026-11-04T06:00:00-03:00'

    Paginacao:
      type: object
      description: Informações de paginação.
      required:
        - pagina
        - tamanho
        - total_itens
        - total_paginas
        - tem_proxima
      properties:
        pagina:
          type: integer
          minimum: 1
          description: Página atual.
          example: 1
        tamanho:
          type: integer
          minimum: 1
          maximum: 100
          description: Itens por página usados nesta resposta.
          example: 50
        total_itens:
          type: integer
          minimum: 0
          description: Total de itens que atendem ao filtro.
          example: 9
        total_paginas:
          type: integer
          minimum: 0
          description: Total de páginas.
          example: 1
        tem_proxima:
          type: boolean
          description: '`true` se existe uma página seguinte.'
          example: false

    ListaRelatos:
      type: object
      description: Página de relatos.
      required:
        - itens
        - paginacao
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Relato'
        paginacao:
          $ref: '#/components/schemas/Paginacao'

    DetalheErro:
      type: object
      description: Problema encontrado em um campo.
      required:
        - campo
        - problema
      properties:
        campo:
          type: string
          example: lat
        problema:
          type: string
          example: deve estar entre -90 e 90

    Erro:
      type: object
      description: Formato único de erro da API.
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: string
          description: Código estável do erro, em `snake_case`.
          example: dados_invalidos
        mensagem:
          type: string
          description: Explicação legível.
          example: Os dados enviados não são válidos.
        detalhes:
          type: array
          description: Problemas por campo, quando houver.
          items:
            $ref: '#/components/schemas/DetalheErro'
