                      - id: 9c4d1f08-5e27-4a39-8b6e-0d2f7a3c1b66
                        criado_em: '2026-10-28T17:45:00-03:00'
                        lat: -23.5668
                        lon: -46.6925
                        foto_url: https://fotos.exemplo.invalid/relatos/9c4d1f08.jpg
                        descricao: null
