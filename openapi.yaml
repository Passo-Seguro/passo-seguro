openapi: 3.1.0

info:
  title: API Passo Seguro
  version: 1.0.0-rc2
  summary: Contratos de integração da plataforma de zeladoria colaborativa de calçadas de São Paulo.
  description: |
    A API é o **único ponto de integração** do Passo Seguro: app (PWA), robô inspetor,
    serviço de visão, assistente, automação de triagem (RPA) e pipeline de dados
    (Airflow + Databricks) conversam somente por ela.

    Este contrato está **em revisão** (v1.0.0-rc2). Mudanças passam por pull request que
    altere este arquivo e avise as outras partes.

    **Mudanças da rc2 em relação à rc1 (propostas, aguardando aprovação do grupo):**
    `autor_id` opcional em `POST /relatos`; cabeçalho `X-Device-Token` para o robô;
    novos `GET /relatos/proximos`, `GET /meus-relatos` e `PATCH /relatos/{id}`.

    ## Convenções

    - Textos em português; campos em `snake_case`, sem acento.
    - Classes de problema (`categoria`): `buraco`, `piso_danificado`, `obstaculo`,
      `veiculo_na_calcada`. A definição de cada uma está em `contratos/classes.yaml`,
      a fonte única de verdade, e o enum deste arquivo é conferido contra ela por
      `scripts/checar-classes.py`.
    - `confianca` é sempre um número de 0 a 1.
    - Datas em ISO 8601 com fuso, por exemplo `2026-11-04T14:32:10-03:00`.
    - Coordenadas em graus decimais (WGS84).

    ## Autenticação (decisão provisória)

    O esquema `bearerAuth` (cabeçalho `Authorization: Bearer <token>`) protege apenas as
    **chamadas entre serviços**: `GET /relatos` (triagem e Airflow) e `POST /deteccoes`
    (API e triagem).

    `POST /relatos` com `fonte=app`, `GET /relatos/proximos`, `GET /meus-relatos`,
    `POST /assistente` e `GET /painel` ficam **públicos**. Esta é uma decisão provisória,
    para simplificar o MVP. Antes de uso real, avaliar autenticação do app, limite de
    requisições e proteção contra abuso.

    Duas credenciais simples complementam o `bearerAuth` (também provisórias):

    - `deviceToken` (cabeçalho `X-Device-Token`): identifica o **robô**. É obrigatório em
      `POST /relatos` quando `fonte=robo`; sem ele, ou com valor inválido, a resposta é 401.
    - `autorId` (cabeçalho `X-Autor-Id`): o id anônimo gerado no aparelho do cidadão. Não
      é segredo forte; só liga o aparelho aos relatos que ele mesmo criou
      (`GET /meus-relatos` e `PATCH /relatos/{id}` no modo app).

    ## Limites (decisão provisória)

    A foto de `POST /relatos` e a imagem de `POST /deteccoes` podem ter no máximo
    **10 MB** (10 × 1024 × 1024 bytes). Acima disso a API responde **413**.

    ## Dados pessoais

    O `autor_id` (id anônimo do aparelho) é **recebido, mas nunca devolvido** pela API: ela
    guarda só o hash (SHA-256 com sal). Nenhuma resposta traz o autor, nem o id nem o hash.
    As respostas públicas com localização (`GET /relatos/proximos`) trazem `lat` e `lon`
    **arredondados a 3 casas decimais** (cerca de 100 m).

    O campo `descricao` é texto livre digitado pelo cidadão e **pode conter telefone ou
    CPF**. A API guarda o texto como recebido; a automação de triagem mascara esses dados
    depois. Todos os exemplos deste contrato usam dados claramente fictícios.

    ## Mock

    `scripts/mock.sh` sobe um servidor de mock em `http://localhost:4010`. Para escolher
    um exemplo específico, envie o cabeçalho `Prefer: example=<nome>`; para escolher um
    código de resposta, `Prefer: code=<codigo>`.

servers:
  - url: http://localhost:4010
    description: Mock local (scripts/mock.sh)

tags:
  - name: Relatos
    description: Relatos de problemas em calçadas, feitos pelo app ou pelo robô inspetor.
  - name: Deteccoes
    description: Detecção de problemas em imagens pelo serviço de visão.
  - name: Assistente
    description: Assistente com LLM local que orienta o pedestre, com fontes.
  - name: Painel
    description: Prioridades por subprefeitura, vindas do pipeline de dados.

paths:
  /relatos:
    post:
      tags: [Relatos]
      operationId: criarRelato
      summary: Cria um relato de problema na calçada
      description: |
        Chamado pelo **app** e pelo **robô**. Recebe a foto, a localização e uma descrição
        opcional; a API pede a detecção ao serviço de visão e devolve o id do relato e a
        classe detectada.

        O relato é **sempre criado com status `novo`**. Se a visão não detectar nada, o
        relato é criado do mesmo jeito, com `categoria` e `confianca` nulos. A regra
        "confiança menor que 0,5 vai para `revisao_humana`" **não é da API: é da triagem**
        (RPA), que muda o status depois.

        A foto pode ter no máximo **10 MB** (decisão provisória); acima disso, 413.

        O campo opcional `autor_id` é o id anônimo gerado no aparelho. A API guarda só o
        hash e **nunca o devolve**; ele permite ao cidadão ver (`GET /meus-relatos`) e
        corrigir a categoria (`PATCH /relatos/{id}`) dos próprios relatos.

        **Autenticação por fonte.** Com `fonte=app` o endpoint é **público** (decisão
        provisória, ver a introdução do contrato). Com `fonte=robo` o cabeçalho
        `X-Device-Token` é **obrigatório**; se faltar ou for inválido, a resposta é 401.
      security:
        - {}
        - deviceToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NovoRelato'
            encoding:
              foto:
                contentType: image/jpeg, image/png
            examples:
              app:
                summary: Relato feito pelo app
                value:
                  foto: calcada-se.jpg
                  lat: -23.5505
                  lon: -46.6333
                  descricao: Buraco grande na calçada em frente ao número 120.
                  fonte: app
                  autor_id: 3f2b8c1e-7d4a-4e90-9b15-6a0c2d8e4f71
              robo:
                summary: Relato enviado pelo robô inspetor
                value:
                  foto: robo-0042.jpg
                  lat: -23.5672
                  lon: -46.6916
                  fonte: robo
      responses:
        '201':
          description: Relato criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatoCriado'
              examples:
                buraco:
                  summary: Classe buraco
                  value:
                    id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                    categoria: buraco
                    confianca: 0.94
                    status: novo
                piso_danificado:
                  summary: Classe piso_danificado
                  value:
                    id: 5d1c7e22-93aa-4b0e-b7c1-2e4f8a6d9c10
                    categoria: piso_danificado
                    confianca: 0.88
                    status: novo
                obstaculo:
                  summary: Classe obstaculo
                  value:
                    id: a47e90b5-6c3f-4d18-9a2b-7f1e3c5d8e22
                    categoria: obstaculo
                    confianca: 0.81
                    status: novo
                veiculo_na_calcada:
                  summary: Classe veiculo_na_calcada
                  value:
                    id: c92d4f61-0b8e-47a3-a5d6-1e9b7f3a2c33
                    categoria: veiculo_na_calcada
                    confianca: 0.97
                    status: novo
                nada_detectado:
                  summary: A visão não detectou nada
                  value:
                    id: e3a85c17-2d4b-4f90-8c61-9b0d6e7f1a44
                    categoria: null
                    confianca: null
                    status: novo
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/DispositivoNaoAutenticado'
        '413':
          $ref: '#/components/responses/ArquivoGrande'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

    get:
      tags: [Relatos]
      operationId: listarRelatos
      summary: Lista relatos, paginados
      description: |
        Chamado pela **triagem (RPA)** e pelo **Airflow** para buscar relatos, por exemplo
        `GET /relatos?status=novo`. Sem o parâmetro `status`, a lista traz **todos os
        status**. A resposta é paginada: o consumidor percorre "página a página" aumentando
        `pagina` até `paginacao.tem_proxima` ser `false`.

        Os relatos vêm ordenados do mais antigo para o mais recente (`criado_em`).

        **Atenção para quem muda o status dos itens (por exemplo, a triagem).** A paginação
        é **por número de página**. Se você processar e mudar o status dos itens enquanto
        pagina com `status=novo`, os relatos restantes sobem de página e alguns são
        pulados. Por isso, quem processa e muda o status deve **ler TODAS as páginas ANTES
        de processar**. Para uma coleta incremental (como a do Airflow), use `criado_desde`.

        Endpoint **protegido** por `bearerAuth` (chamada entre serviços).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtra os relatos pelo status. Se omitido, traz todos os status.
          required: false
          schema:
            $ref: '#/components/schemas/StatusRelato'
        - name: criado_desde
          in: query
          description: Traz só os relatos criados a partir deste instante (inclusive).
          required: false
          schema:
            type: string
            format: date-time
            example: '2026-11-04T00:00:00-03:00'
        - name: pagina
          in: query
          description: Número da página, começando em 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: tamanho
          in: query
          description: Quantidade de itens por página.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 50
      responses:
        '200':
          description: Página de relatos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRelatos'
              examples:
                novos:
                  summary: "status=novo: um relato de cada classe e um sem detecção, ainda sem triagem"
                  value:
                    itens:
                      - id: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
                        criado_em: '2026-11-04T14:32:10-03:00'
                        lat: -23.5505
                        lon: -46.6333
                        foto_url: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
                        descricao: Buraco grande na calçada em frente ao número 120.
                        categoria: buraco
                        confianca: 0.94
                        fonte: app
                        status: novo
                        confirmacoes: 0
                        subprefeitura: null
                        prioridade: null
                      - id: 5d1c7e22-93aa-4b0e-b7c1-2e4f8a6d9c10
                        criado_em: '2026-11-04T14:51:42-03:00'
                        lat: -23.5489
                        lon: -46.6388
                        foto_url: https://fotos.exemplo.invalid/relatos/5d1c7e22.jpg
                        descricao: Lajes soltas, quase caí. Falar com Maria no (11) 90000-0000.
                        categoria: piso_danificado
                        confianca: 0.88
                        fonte: app
                        status: novo
                        confirmacoes: 0
                        subprefeitura: null
                        prioridade: null
                      - id: a47e90b5-6c3f-4d18-9a2b-7f1e3c5d8e22
                        criado_em: '2026-11-04T15:08:03-03:00'
                        lat: -23.5672
                        lon: -46.6916
                        foto_url: https://fotos.exemplo.invalid/relatos/a47e90b5.jpg
                        descricao: Entulho de obra ocupando toda a calçada. CPF do morador 000.000.000-00.
                        categoria: obstaculo
                        confianca: 0.81
                        fonte: app
                        status: novo
                        confirmacoes: 0
                        subprefeitura: null
                        prioridade: null
                      - id: c92d4f61-0b8e-47a3-a5d6-1e9b7f3a2c33
                        criado_em: '2026-11-04T15:40:27-03:00'
                        lat: -23.5649
                        lon: -46.6952
