        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /deteccoes:
    post:
      tags: [Deteccoes]
      operationId: detectarProblemas
      summary: Detecta problemas de calçada em uma imagem
      description: |
        Chamado pela **API** (ao criar um relato) e pela **triagem**. Recebe a imagem e
        devolve a lista de problemas detectados, ordenada da maior para a menor
        `confianca`. Uma lista vazia significa que nada foi detectado.

        **Formato da `caixa`** (decisão do projeto): `{x, y, largura, altura}`, todos
        **normalizados de 0 a 1** em relação ao tamanho da imagem. `x` e `y` são o canto
        superior esquerdo da caixa. Quem treina o YOLO deve converter, porque o formato de
        rótulo do YOLO usa o centro da caixa.

        A imagem pode ter no máximo **10 MB** (decisão provisória); acima disso, 413.

        Endpoint **protegido** por `bearerAuth` (chamada entre serviços).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NovaDeteccao'
            encoding:
              imagem:
                contentType: image/jpeg, image/png
            examples:
              imagem:
                summary: Imagem de uma calçada
                value:
                  imagem: calcada-pinheiros.jpg
      responses:
        '200':
          description: Lista de detecções (pode ser vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deteccao'
              examples:
                buraco:
                  summary: Um buraco
                  value:
                    - classe: buraco
                      confianca: 0.94
                      caixa: {x: 0.31, y: 0.58, largura: 0.22, altura: 0.17}
                piso_danificado:
                  summary: Piso danificado
                  value:
                    - classe: piso_danificado
                      confianca: 0.88
                      caixa: {x: 0.12, y: 0.64, largura: 0.48, altura: 0.25}
                obstaculo:
                  summary: Obstáculo
                  value:
                    - classe: obstaculo
                      confianca: 0.81
                      caixa: {x: 0.40, y: 0.30, largura: 0.35, altura: 0.52}
                veiculo_na_calcada:
                  summary: Veículo na calçada
                  value:
                    - classe: veiculo_na_calcada
                      confianca: 0.97
                      caixa: {x: 0.05, y: 0.22, largura: 0.71, altura: 0.60}
                varias:
                  summary: Mais de um problema na mesma imagem
                  value:
                    - classe: veiculo_na_calcada
                      confianca: 0.97
                      caixa: {x: 0.05, y: 0.22, largura: 0.71, altura: 0.60}
                    - classe: piso_danificado
                      confianca: 0.63
                      caixa: {x: 0.60, y: 0.78, largura: 0.30, altura: 0.18}
                nada_detectado:
                  summary: Nada detectado
                  value: []
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '413':
          $ref: '#/components/responses/ArquivoGrande'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /assistente:
    post:
      tags: [Assistente]
      operationId: perguntarAoAssistente
      summary: Pergunta ao assistente do pedestre
      description: |
        Chamado pelo **app**. O assistente (LLM local com RAG) responde sobre quem é
        responsável por consertar um problema de calçada e como reclamar, sempre citando
        as `fontes`. Perguntas fora desse escopo, ou sem base nas fontes, são recusadas
        com `recusou: true`.

        Endpoint **público** (decisão provisória, ver a introdução do contrato). Os
        textos dos exemplos são ilustrativos, não orientação oficial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntaAssistente'
            examples:
              com_fontes:
                summary: Pergunta dentro do escopo
                value:
                  pergunta: Quem conserta uma calçada quebrada em frente ao meu prédio?
              recusa:
                summary: Pergunta fora do escopo
                value:
                  pergunta: Qual a melhor ação para investir esse mês?
      responses:
        '200':
          description: Resposta do assistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAssistente'
              examples:
                com_fontes:
                  summary: Respondeu, com fontes (recusou false)
                  value:
                    resposta: Em geral, o cuidado com o piso da calçada é de quem é dono do imóvel em frente. Se o problema for na área pública ou causado por obra de concessionária, a subprefeitura da região pode ser acionada pelo canal 156. Registre o problema aqui para acompanhar o caso.
                    fontes:
                      - titulo: Cartilha de calçadas da subprefeitura (exemplo)
                        url: https://documentos.exemplo.invalid/cartilha-calcadas.pdf
                    confianca: 0.86
                    recusou: false
                recusa:
                  summary: Recusou responder (recusou true)
                  value:
                    resposta: Eu só consigo ajudar com problemas em calçadas de São Paulo, como quem conserta e como reclamar. Não tenho como responder sobre investimentos.
                    fontes: []
                    confianca: 0.1
                    recusou: true
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /painel:
    get:
      tags: [Painel]
      operationId: obterPainel
      summary: Prioridades por subprefeitura
      description: |
        Chamado pelo **app**. Devolve as prioridades por subprefeitura, lidas da view
        `vw_prioridades` da camada Ouro, exportada pelo pipeline de dados para a API. Os
        itens vêm ordenados da maior para a menor prioridade.

        Endpoint **público** (decisão provisória, ver a introdução do contrato).
      security: []
      responses:
        '200':
          description: Prioridades por subprefeitura.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioridadeSubprefeitura'
              examples:
                se_e_pinheiros:
                  summary: Sé e Pinheiros
                  value:
                    - subprefeitura: Sé
                      prioridade: alta
                      relatos_abertos: 69
                      relatos_por_categoria:
                        buraco: 12
                        piso_danificado: 31
                        obstaculo: 9
                        veiculo_na_calcada: 17
                      tempo_medio_ate_reparo_dias: 41.5
                      atualizado_em: '2026-11-04T06:00:00-03:00'
                    - subprefeitura: Pinheiros
                      prioridade: media
                      relatos_abertos: 38
                      relatos_por_categoria:
                        buraco: 5
                        piso_danificado: 14
                        obstaculo: 11
                        veiculo_na_calcada: 8
                      tempo_medio_ate_reparo_dias: null
                      atualizado_em: '2026-11-04T06:00:00-03:00'
        '404':
          description: Ainda não há painel disponível, porque o pipeline não exportou a view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                sem_painel:
                  value:
                    codigo: painel_indisponivel
                    mensagem: O painel de prioridades ainda não foi exportado pelo pipeline de dados.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token enviado em `Authorization: Bearer <token>`. Usado apenas nas chamadas entre
        serviços (`GET /relatos` e `POST /deteccoes`). Decisão provisória; nenhum token
        real é versionado no repositório.

  responses:
    RequisicaoInvalida:
      description: Requisição malformada, por exemplo parâmetro de consulta inválido ou corpo que não é do tipo esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            parametro_invalido:
              value:
                codigo: requisicao_invalida
                mensagem: A requisição está malformada.
                detalhes:
                  - campo: tamanho
                    problema: deve ser um inteiro entre 1 e 100
    DadosInvalidos:
      description: A requisição está bem formada, mas os dados não passam na validação. Por exemplo, coordenadas fora do município de São Paulo, imagem ilegível ou pergunta vazia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            dados_invalidos:
              value:
                codigo: dados_invalidos
                mensagem: Os dados enviados não são válidos.
                detalhes:
                  - campo: lat
                    problema: deve estar entre -90 e 90
    ArquivoGrande:
      description: O arquivo enviado passa do tamanho máximo de 10 MB (decisão provisória).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            arquivo_grande:
              value:
                codigo: arquivo_grande
                mensagem: O arquivo enviado passa do tamanho máximo de 10 MB.
    NaoAutenticado:
      description: Token ausente ou inválido. Este endpoint é uma chamada entre serviços e exige `bearerAuth`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            sem_token:
              value:
                codigo: nao_autenticado
                mensagem: Token ausente ou inválido.

  schemas:
    Categoria:
      type: string
      description: |
        Classe do problema de calçada. Os valores e a ordem vêm de `contratos/classes.yaml`
        (fonte única de verdade). A posição na lista é o índice da classe no YOLO.
      enum:
        - buraco
        - piso_danificado
        - obstaculo
        - veiculo_na_calcada
      example: buraco

    StatusRelato:
      type: string
      description: |
        Etapa do relato. Fluxo normal: `novo` → `revisao_humana` → `validado` →
        `encaminhado` → `resolvido`. Um relato também pode terminar em `rejeitado`.

        A API sempre cria o relato como `novo`. As mudanças seguintes são feitas pela
        triagem, por exemplo "confiança menor que 0,5 → `revisao_humana`".
      enum:
        - novo
        - revisao_humana
        - validado
        - encaminhado
        - resolvido
        - rejeitado
      example: novo

    Prioridade:
      type: string
      description: Prioridade de atendimento.
      enum:
        - alta
        - media
        - baixa
      example: alta

    FonteRelato:
      type: string
      description: Quem originou o relato.
      enum:
        - app
        - robo
      example: app

    Confianca:
      type: number
      minimum: 0
      maximum: 1
      description: Confiança, de 0 a 1.
      example: 0.94

    CategoriaOuNula:
      description: |
        Mesma `Categoria`, ou `null` quando o serviço de visão não detectou nada. Só vale
        para `Relato` e `RelatoCriado`; em `Deteccao` a classe nunca é nula.
      oneOf:
        - $ref: '#/components/schemas/Categoria'
        - type: 'null'
      example: buraco

    ConfiancaOuNula:
      description: |
        Confiança de 0 a 1, ou `null` quando o serviço de visão não detectou nada. Só vale
        para `Relato` e `RelatoCriado`; em `Deteccao` a confiança nunca é nula.
      oneOf:
        - $ref: '#/components/schemas/Confianca'
        - type: 'null'
      example: 0.94

    Relato:
      type: object
      description: Um relato de problema em calçada.
      required:
        - id
        - criado_em
        - lat
        - lon
        - foto_url
        - categoria
        - confianca
        - fonte
        - status
        - confirmacoes
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        criado_em:
          type: string
          format: date-time
          description: Quando o relato foi criado.
          example: '2026-11-04T14:32:10-03:00'
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude em graus decimais.
          example: -23.5505
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude em graus decimais.
          example: -46.6333
        foto_url:
          type: string
          format: uri
          description: Endereço da foto do relato.
          example: https://fotos.exemplo.invalid/relatos/0b6f6a3e.jpg
        descricao:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: |
            Texto livre do cidadão; pode ser nulo. **Pode conter telefone ou CPF**, que a
            triagem mascara depois.
          example: Buraco grande na calçada em frente ao número 120.
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        confianca:
          $ref: '#/components/schemas/ConfiancaOuNula'
        fonte:
          $ref: '#/components/schemas/FonteRelato'
        status:
          $ref: '#/components/schemas/StatusRelato'
        confirmacoes:
          type: integer
          minimum: 0
          description: Quantas pessoas confirmaram o mesmo problema. Começa em 0.
          example: 3
        subprefeitura:
          type:
            - string
            - 'null'
          description: |
            Subprefeitura responsável pelo local. Nula enquanto o relato está `novo`; fica
            preenchida a partir de `encaminhado`.
          example: Sé
        prioridade:
          description: |
            Prioridade de atendimento. Nula enquanto o relato está `novo`; fica preenchida
            a partir de `encaminhado`.
          oneOf:
            - $ref: '#/components/schemas/Prioridade'
            - type: 'null'
          example: alta

    NovoRelato:
      type: object
      description: Corpo `multipart/form-data` de `POST /relatos`.
      required:
        - foto
        - lat
        - lon
        - fonte
      properties:
        foto:
          type: string
          format: binary
          description: Arquivo da foto (JPEG ou PNG), de no máximo 10 MB (decisão provisória).
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude em graus decimais.
          example: -23.5505
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude em graus decimais.
          example: -46.6333
        descricao:
          type: string
          maxLength: 1000
          description: Texto livre opcional. Pode conter telefone ou CPF digitado pelo cidadão.
          example: Buraco grande na calçada em frente ao número 120.
        fonte:
          $ref: '#/components/schemas/FonteRelato'

    RelatoCriado:
      type: object
      description: Resposta de `POST /relatos`.
      required:
        - id
        - categoria
        - confianca
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relato criado.
          example: 0b6f6a3e-1c1d-4a52-8f0e-6a2d9c1e7b01
        categoria:
          $ref: '#/components/schemas/CategoriaOuNula'
        confianca:
          $ref: '#/components/schemas/ConfiancaOuNula'
        status:
          type: string
          const: novo
          description: A API sempre cria o relato como `novo`.
          example: novo

    NovaDeteccao:
      type: object
      description: Corpo `multipart/form-data` de `POST /deteccoes`.
      required:
        - imagem
      properties:
        imagem:
          type: string
          format: binary
          description: Arquivo da imagem (JPEG ou PNG), de no máximo 10 MB (decisão provisória).

    Caixa:
      type: object
      description: |
        Caixa delimitadora **normalizada de 0 a 1** em relação à largura e à altura da
        imagem. `x` e `y` são o canto superior esquerdo.
      required:
        - x
        - y
        - largura
        - altura
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
          description: Posição horizontal do canto superior esquerdo.
          example: 0.31
        y:
          type: number
          minimum: 0
          maximum: 1
          description: Posição vertical do canto superior esquerdo.
          example: 0.58
        largura:
          type: number
          minimum: 0
          maximum: 1
          description: Largura da caixa.
          example: 0.22
        altura:
          type: number
          minimum: 0
          maximum: 1
          description: Altura da caixa.
          example: 0.17

    Deteccao:
      type: object
      description: Um problema detectado em uma imagem.
      required:
        - classe
        - confianca
        - caixa
      properties:
        classe:
          $ref: '#/components/schemas/Categoria'
        confianca:
          $ref: '#/components/schemas/Confianca'
        caixa:
          $ref: '#/components/schemas/Caixa'
      example:
        classe: buraco
        confianca: 0.94
        caixa: {x: 0.31, y: 0.58, largura: 0.22, altura: 0.17}

    PerguntaAssistente:
      type: object
      description: Corpo de `POST /assistente`.
      required:
        - pergunta
      properties:
        pergunta:
          type: string
          minLength: 1
          maxLength: 500
          description: Pergunta do pedestre, em texto livre.
          example: Quem conserta uma calçada quebrada em frente ao meu prédio?

    FonteCitada:
      type: object
      description: Documento em que o assistente se baseou.
      required:
        - titulo
      properties:
        titulo:
          type: string
          description: Título do documento.
          example: Cartilha de calçadas da subprefeitura (exemplo)
        url:
          type: string
          format: uri
          description: Endereço do documento, quando houver.
          example: https://documentos.exemplo.invalid/cartilha-calcadas.pdf

    RespostaAssistente:
      type: object
      description: Resposta de `POST /assistente`.
      required:
        - resposta
        - fontes
        - confianca
        - recusou
      properties:
        resposta:
          type: string
          description: Texto da resposta, ou a explicação da recusa.
          example: Em geral, o cuidado com o piso da calçada é de quem é dono do imóvel em frente. Registre o problema aqui para acompanhar o caso.
        fontes:
          type: array
          description: Documentos citados. Fica vazio quando `recusou` é `true`.
          items:
            $ref: '#/components/schemas/FonteCitada'
        confianca:
          $ref: '#/components/schemas/Confianca'
        recusou:
          type: boolean
          description: '`true` quando o assistente se recusou a responder, por estar fora do escopo ou sem base nas fontes.'
          example: false

    PrioridadeSubprefeitura:
      type: object
      description: Linha da view `vw_prioridades` (camada Ouro), por subprefeitura.
      required:
        - subprefeitura
        - prioridade
        - relatos_abertos
        - relatos_por_categoria
        - atualizado_em
      properties:
        subprefeitura:
          type: string
          example: Sé
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        relatos_abertos:
          type: integer
          minimum: 0
          description: Relatos ainda não resolvidos nem rejeitados.
          example: 69
        relatos_por_categoria:
          type: object
          description: Relatos abertos por classe de problema.
          propertyNames:
            $ref: '#/components/schemas/Categoria'
          additionalProperties:
            type: integer
            minimum: 0
          example:
            buraco: 12
            piso_danificado: 31
            obstaculo: 9
            veiculo_na_calcada: 17
        tempo_medio_ate_reparo_dias:
          type:
            - number
            - 'null'
          minimum: 0
          description: Tempo médio até o reparo, em dias; nulo quando ainda não há reparos.
          example: 41.5
        atualizado_em:
          type: string
          format: date-time
          description: Quando o pipeline exportou os dados.
          example: '2026-11-04T06:00:00-03:00'

    Paginacao:
      type: object
      description: Informações de paginação.
      required:
        - pagina
        - tamanho
        - total_itens
        - total_paginas
        - tem_proxima
      properties:
        pagina:
          type: integer
          minimum: 1
          description: Página atual.
          example: 1
        tamanho:
          type: integer
          minimum: 1
          maximum: 100
          description: Itens por página usados nesta resposta.
          example: 50
        total_itens:
          type: integer
          minimum: 0
          description: Total de itens que atendem ao filtro.
          example: 9
        total_paginas:
          type: integer
          minimum: 0
          description: Total de páginas.
          example: 1
        tem_proxima:
          type: boolean
          description: '`true` se existe uma página seguinte.'
          example: false

    ListaRelatos:
      type: object
      description: Página de relatos.
      required:
        - itens
        - paginacao
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Relato'
        paginacao:
          $ref: '#/components/schemas/Paginacao'

    DetalheErro:
      type: object
      description: Problema encontrado em um campo.
      required:
        - campo
        - problema
      properties:
        campo:
          type: string
          example: lat
        problema:
          type: string
          example: deve estar entre -90 e 90

    Erro:
      type: object
      description: Formato único de erro da API.
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: string
          description: Código estável do erro, em `snake_case`.
          example: dados_invalidos
        mensagem:
          type: string
          description: Explicação legível.
          example: Os dados enviados não são válidos.
        detalhes:
          type: array
          description: Problemas por campo, quando houver.
          items:
            $ref: '#/components/schemas/DetalheErro'
