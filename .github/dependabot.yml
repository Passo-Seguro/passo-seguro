# Atualizações semanais de dependências. Cada ecossistema abre PRs separados, que passam
# pelo mesmo pipeline (ci.yml) antes de entrar.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode ser malicioso
    # ou instável).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode ser malicioso
    # ou instável).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(api)"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode ser malicioso
    # ou instável).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(app)"

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode ser malicioso
    # ou instável).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(api)"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode ser malicioso
    # ou instável).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(app)"
