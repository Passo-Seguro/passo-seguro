# Testes da API a cada push. Fluxo mínimo; o DevOps estende depois (build da imagem,
# varredura de segredos e de dependências, deploy).
name: api-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Postgres com PostGIS para os testes. As credenciais são fictícias e só existem neste job.
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: passo
          POSTGRES_PASSWORD: passo-dev
          POSTGRES_DB: passo_seguro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passo -d passo_seguro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://passo:passo-dev@localhost:5432/passo_seguro_test
      # No CI, banco fora do ar é falha (e não "teste pulado").
      EXIGIR_BANCO: "1"

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Inclui o teste de contrato (Schemathesis contra o openapi.yaml da raiz).
      - name: Testes
        run: pytest -q
